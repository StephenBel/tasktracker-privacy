<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Превиз «Дрема»</title>
<style>
  :root { --bg: #111214; --panel: #1a1b1f; --text: #e8e6e1; --muted: #8d8a82; --accent: #d9a441; }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 14px/1.4 system-ui, sans-serif; }
  main { display: grid; grid-template-columns: 1fr 320px; gap: 16px; padding: 16px; max-width: 1600px; margin: 0 auto; }
  @media (max-width: 900px) { main { grid-template-columns: 1fr; } }
  .stage { position: relative; background: #000; }
  canvas { display: block; width: 100%; height: auto; }
  #hud { position: absolute; left: 12px; bottom: 10px; right: 12px; font-size: 13px; text-shadow: 0 1px 3px #000; }
  #hud b { color: var(--accent); }
  header { display: flex; align-items: center; gap: 12px; margin-bottom: 10px; }
  h1 { font-size: 18px; margin: 0; font-weight: 600; }
  button { background: var(--accent); color: #111; border: 0; padding: 6px 14px; border-radius: 4px; font-weight: 600; cursor: pointer; }
  aside { background: var(--panel); border-radius: 6px; max-height: calc(100vh - 32px); overflow: auto; }
  ol { list-style: none; margin: 0; padding: 0; }
  li { padding: 10px 12px; border-bottom: 1px solid #26272c; cursor: pointer; }
  li span { color: var(--muted); font-size: 12px; margin-left: 6px; }
  li div { color: var(--muted); font-size: 12px; margin-top: 2px; }
  li.on { background: #2a2618; }
  li.on b { color: var(--accent); }
</style>
<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
} }
</script>
</head>
<body>
<main>
  <section>
    <header><h1>ДРЕМА · превиз сцен 1-3</h1><button id="play">▶ Аниматик</button></header>
    <div class="stage"><canvas id="view"></canvas><div id="hud"></div></div>
  </section>
  <aside><ol id="shots"></ol></aside>
</main>
<script type="module" src="./previz.js"></script>
</body>
</html>
